[package]
name = "hatcher-playground"
version = "0.1.0"
edition = "2021"
authors = ["HatcherLabs"]
description = "Simulation playground for agentic mesh rehearsal, debate, and policy exploration."
license = "MIT"
repository = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
homepage = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
keywords = ["agentic", "mesh", "simulation", "playground", "rust"]
categories = ["algorithms", "science", "simulation"]
readme = "../../README.md"

[dependencies]
hatcher-core = { path = "../hatcher-core" }
hatcher-neural = { path = "../hatcher-neural" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
