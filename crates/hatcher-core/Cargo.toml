[package]
name = "hatcher-core"
version = "0.1.0"
edition = "2021"
authors = ["HatcherLabs"]
description = "Core contracts and deterministic serialization for the Hatcher neural mesh."
license = "MIT"
repository = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
homepage = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
keywords = ["agentic", "mesh", "serialization", "neural", "rust"]
categories = ["algorithms", "science", "simulation"]
readme = "../../README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
sha2 = "0.10"
