[package]
name = "hatcher-ux"
version = "0.1.0"
edition = "2021"
authors = ["HatcherLabs"]
description = "Terminal UX demonstrating the Hatcher neural mesh as an agentic playground."
license = "MIT"
repository = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
homepage = "https://github.com/hatcherlabs/hatcher-neural-network-mesh"
keywords = ["agentic", "ux", "terminal", "mesh", "rust"]
categories = ["command-line-utilities", "simulation"]
readme = "../../README.md"

[dependencies]
hatcher-core = { path = "../hatcher-core" }
hatcher-neural = { path = "../hatcher-neural" }
hatcher-playground = { path = "../hatcher-playground" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
warp = "0.3"
tokio = { version = "1", features = ["full"] }
